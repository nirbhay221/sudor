<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudor</title>
<!--
  MCP App view for the things that are not the hour-by-hour strip: what is on record about a person, a
  contact being confirmed, and the one card that matters most, the one that says call 911.

  The day strip (window.html) was the only view. Alexa+'s guidance gives each pattern a job: a card is one
  thing in focus, a list is a stack of like things, and a commit screen shows every detail in full. This
  file is those patterns and nothing else, driven by the `card` object a tool returns:

    { kind: 'card' | 'list', title, status?: { label, tone }, lines?: [], items?: [{ title, note, tone }],
      confirm?: 'what saying yes will do', foot? }

  tone is good, bad or neutral, and is never the only signal: every status is a word, with a mark in
  front of it. Text is sized to be read at arm's length.
-->
<style>
  .viz {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f1f1ee;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #686860;
    --rule:           #dcdcd6;
    --good:           #0b7a0b;
    --critical:       #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #242423;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #a3a299;
      --rule:           #34342f;
      --good:           #4cc26a;
      --critical:       #ef7a6d;
    }
  }
  :root[data-theme="dark"] .viz {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #242423;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #a3a299;
    --rule:           #34342f;
    --good:           #4cc26a;
    --critical:       #ef7a6d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz {
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 18px 20px 20px;
    font-size: 1.05rem;
    line-height: 1.4;
  }
  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -0.015em; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 3px; border: 1.5px solid currentColor;
  }
  .good { color: var(--good); }
  .bad { color: var(--critical); }
  .neutral { color: var(--text-secondary); }
  p { margin: 0 0 8px; color: var(--text-secondary); }
  ul { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--rule); }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  li .t { font-weight: 600; }
  li .n { color: var(--text-secondary); text-align: right; }
  .confirm { margin-top: 12px; padding: 10px 12px; background: var(--surface-2); border-left: 4px solid var(--text-primary); color: var(--text-primary); }
  .foot { margin-top: 12px; font-size: 0.8rem; color: var(--text-muted); }
  @media (prefers-contrast: more) {
    .viz { --text-secondary: var(--text-primary); --text-muted: var(--text-primary); --rule: var(--text-primary); }
  }
</style>
</head>
<body>
<main class="viz" id="card" aria-live="polite">
  <div class="head"><h1 id="title">Sudor</h1><span class="chip neutral" id="chip" hidden></span></div>
  <div id="lines"></div>
  <ul id="items" hidden></ul>
  <div class="confirm" id="confirm" hidden></div>
  <div class="foot" id="foot"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const MARK = { good: '✓ ', bad: '× ', neutral: '' };
  const tone = (t) => (t === 'good' || t === 'bad' ? t : 'neutral');

  // Everything is written with textContent. What a tool returns includes names a customer chose.
  function render(card, opts) {
    $('title').textContent = card.title || 'Sudor';
    const chip = $('chip');
    chip.hidden = !card.status || !card.status.label;
    if (!chip.hidden) {
      chip.className = 'chip ' + tone(card.status.tone);
      chip.textContent = MARK[tone(card.status.tone)] + card.status.label;
    }
    const lines = $('lines');
    lines.textContent = '';
    for (const line of (card.lines || []).slice(0, 4)) {
      const p = document.createElement('p');
      p.textContent = line;
      lines.appendChild(p);
    }
    const list = $('items');
    list.textContent = '';
    const items = (card.items || []).slice(0, 8);
    list.hidden = items.length === 0;
    for (const item of items) {
      const li = document.createElement('li');
      const t = document.createElement('span');
      t.className = 't';
      t.textContent = item.title || '';
      const n = document.createElement('span');
      n.className = 'n ' + tone(item.tone);
      n.textContent = MARK[tone(item.tone)] + (item.note || '');
      li.appendChild(t);
      li.appendChild(n);
      list.appendChild(li);
    }
    const confirm = $('confirm');
    confirm.hidden = !card.confirm;
    confirm.textContent = card.confirm || '';
    $('foot').textContent = (opts && opts.example ? 'Example. ' : '') + (card.foot || '');
  }

  const EXAMPLE = {
    kind: 'card',
    title: 'Today, for you',
    status: { label: 'take care', tone: 'neutral' },
    lines: ['Heat index 96 this afternoon.', 'Best time to be out: 7 to 9 am.'],
    foot: 'From the hourly forecast where you are.',
  };

  // MCP Apps bridge, specification 2026-01-26: nothing arrives until the view has initialised.
  const bridge = (() => {
    let nextId = 1;
    const pending = new Map();
    const handlers = {};
    const post = (msg) => window.parent.postMessage(Object.assign({ jsonrpc: '2.0' }, msg), '*');
    window.addEventListener('message', (event) => {
      const m = event.data;
      if (!m || m.jsonrpc !== '2.0') return;
      if (m.id != null && !m.method && pending.has(m.id)) {
        const p = pending.get(m.id);
        pending.delete(m.id);
        if (m.error) p.reject(new Error(m.error.message || 'request failed'));
        else p.resolve(m.result);
        return;
      }
      if (m.method && handlers[m.method]) handlers[m.method](m.params || {});
    });
    return {
      request(method, params) {
        return new Promise((resolve, reject) => {
          const id = nextId++;
          pending.set(id, { resolve, reject });
          post({ id, method, params });
          setTimeout(() => { if (pending.delete(id)) reject(new Error(method + ' timed out')); }, 10000);
        });
      },
      notify(method, params) { post({ method, params }); },
      on(method, fn) { handlers[method] = fn; },
    };
  })();

  const applyTheme = (theme) => {
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  };
  const reportSize = () =>
    bridge.notify('ui/notifications/size-changed', {
      width: document.documentElement.scrollWidth,
      height: document.documentElement.scrollHeight,
    });

  bridge.on('ui/notifications/tool-result', (result) => {
    const d = result.structuredContent;
    if (d && typeof d === 'object' && d.card && typeof d.card === 'object') {
      render(d.card);
      reportSize();
    }
  });
  bridge.on('ui/notifications/host-context-changed', (ctx) => applyTheme(ctx.theme));

  render(EXAMPLE, { example: true });

  if (window.parent && window.parent !== window) {
    bridge
      .request('ui/initialize', {
        protocolVersion: '2026-01-26',
        appInfo: { name: 'sudor-card', version: '0.1.0' },
        appCapabilities: { availableDisplayModes: ['inline'] },
      })
      .then((result) => {
        applyTheme(result && result.hostContext && result.hostContext.theme);
        bridge.notify('ui/notifications/initialized', {});
        reportSize();
      })
      .catch(() => { /* no host answered: the example stays */ });
  }
</script>
</body>
</html>
