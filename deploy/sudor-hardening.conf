# systemd drop-in: install as /etc/systemd/system/sudor.service.d/10-hardening.conf
#
# A drop-in rather than a replacement unit because the running instance's unit file
# carries values that are specific to it, SUDOR_PUBLIC_URL and SUDOR_ORBITA_URL,
# written when it was created. Replacing the unit with the one in this repository
# would quietly lose them: account linking would advertise the wrong address and the
# link to Orbita would go dark, with nothing failing loudly. Caught before the deploy
# that would have done it, by reading the live unit first.
#
# Additive and reversible: delete this file, run `systemctl daemon-reload`, and the
# service is back to what it was.

[Service]
# Fetch secrets from SSM into /run/sudor/env. The + runs it with full privileges
# despite the unit's sandboxing, because it has to write /run/sudor. The service
# itself never runs as root.
ExecStartPre=+/usr/local/libexec/sudor-secrets
EnvironmentFile=-/run/sudor/env

# Refuse to start without a data key rather than store medications in the clear.
Environment=SUDOR_REQUIRE_ENCRYPTION=on

# Account linking needs a passphrase, and tokens survive a deploy. The demo page keeps
# working through its own sandbox door, which cannot reach a linked account.
Environment=SUDOR_AUTH=on
Environment=SUDOR_AUTH_DATA=/var/lib/sudor/auth.json

# One hop: API Gateway. Without it every visitor shares the gateway's address and one
# noisy visitor rate-limits everybody. Safe only because the origin secret, once
# armed, means nothing else can reach this process to forge the header.
Environment=SUDOR_TRUST_PROXY=1
